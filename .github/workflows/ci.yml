name: C++ CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Replay sample events
        run: ./build/order_book_replay data/sample_events.csv

      - name: Run benchmark smoke test
        run: |
          ./build/order_book_benchmark 10000 lifecycle
          ./build/order_book_benchmark 10000 matching

      - name: Run regression-detector tests
        run: python3 -m unittest tests/test_performance_regression.py

      - name: Run mutation experiment
        run: python3 analysis/mutation_experiment.py

      - name: Run property fuzzer with sanitizers
        run: |
          c++ -std=c++17 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Wall -Wextra -Wpedantic -Iinclude \
            src/order_book.cpp tests/order_book_property_fuzz.cpp \
            -o build/order_book_property_fuzz_sanitized
          ./build/order_book_property_fuzz_sanitized 20260831 5000 build/fuzz_failure_sanitized.txt
