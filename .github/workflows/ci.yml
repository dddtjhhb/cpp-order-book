name: C++ CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Replay sample events
        run: ./build/order_book_replay data/sample_events.csv

      - name: Run benchmark smoke test
        run: |
          ./build/order_book_benchmark 10000 lifecycle
          ./build/order_book_benchmark 10000 matching

      - name: Run regression-detector tests
        run: python3 -m unittest tests/test_performance_regression.py

      - name: Run mutation experiment
        run: python3 analysis/mutation_experiment.py

      - name: Run property fuzzer with sanitizers
        run: |
          c++ -std=c++17 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Wall -Wextra -Wpedantic -Iinclude \
            src/order_book.cpp tests/order_book_property_fuzz.cpp \
            -o build/order_book_property_fuzz_sanitized
          for seed in 1 7 42 2026 20260831; do
            ./build/order_book_property_fuzz_sanitized "$seed" 5000 "build/fuzz_failure_sanitized_$seed.txt"
          done

      - name: Run unit tests with sanitizers
        run: |
          c++ -std=c++17 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Wall -Wextra -Wpedantic -Iinclude \
            src/order_book.cpp src/csv_reader.cpp tests/order_book_tests.cpp \
            -o build/order_book_tests_sanitized
          ./build/order_book_tests_sanitized

      - name: Run engine contract tests with sanitizers
        run: |
          c++ -std=c++17 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Wall -Wextra -Wpedantic -Iinclude \
            src/order_book.cpp src/csv_reader.cpp tests/engine_contract_tests.cpp \
            -o build/engine_contract_tests_sanitized
          ./build/engine_contract_tests_sanitized

      - name: Run differential fuzzer with sanitizers
        run: |
          c++ -std=c++17 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Wall -Wextra -Wpedantic -Iinclude -Itests \
            src/order_book.cpp src/csv_reader.cpp tests/order_book_differential.cpp \
            -o build/order_book_differential_sanitized
          for seed in 1 7 42 2026 20260831; do
            ./build/order_book_differential_sanitized "$seed" 5000 "build/differential_failure_$seed.csv"
          done
          for corpus in tests/corpus/*.csv; do
            ./build/order_book_differential_sanitized --replay "$corpus"
          done

      - name: Upload fuzz failure reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: |
            build/fuzz_failure*.txt
            build/differential_failure*
            differential_replay_failure.csv*
          if-no-files-found: ignore
